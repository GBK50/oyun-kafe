<!doctype html><html lang="tr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Oyun Kafe</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>:root{--t:#16877f;--g:#05c878;--n:#173b5c;--bg:#f4f8fa;--l:#dbe7eb}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#142d46;font:14px system-ui}.top{height:82px;background:#fff;display:flex;align-items:center;padding:0 28px;gap:18px;border-bottom:1px solid var(--l);position:sticky;top:0;z-index:3}.brand{font-size:24px;font-weight:900}.brand i{color:#b63cdb}.sp{flex:1}.user{font-weight:700}.bell{background:#edf7f7;border:0;border-radius:12px;padding:12px}.shell{display:flex}.side{width:275px;min-height:calc(100vh - 82px);padding:25px 18px;background:#137a73;color:white}.nav{display:block;width:100%;padding:14px 16px;margin:3px 0;border:0;border-radius:9px;background:transparent;color:#eafffa;text-align:left;font-weight:800}.nav.active{background:#24948c}.main{padding:32px;flex:1;max-width:1600px}.welcome{font-size:29px;margin:8px 0}.muted{color:#647e92}.buttons button,button{border:0;border-radius:10px;padding:11px 15px;font-weight:800;cursor:pointer}.primary{background:var(--t);color:#fff}.orange{background:#ff6900;color:#fff}.kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:13px;margin:22px 0}.kpi,.card{background:#fff;border:1px solid var(--l);border-radius:15px}.kpi{padding:17px}.kpi span{font-size:12px;color:#63798d}.kpi b{display:block;margin-top:9px;font-size:28px}.kpi:nth-child(1){background:#16877f;color:#fff}.kpi:nth-child(2){background:#05c878;color:#fff}.kpi:nth-child(3){background:#ffba0a;color:#fff}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(330px,1fr));gap:18px}.card{padding:18px;border-left:3px solid var(--g)}.card.break{border-color:#e8ad00}.head{display:flex;justify-content:space-between;gap:8px}.name{font-size:18px;font-weight:900}.status{padding:6px 10px;border-radius:30px;background:#d8faea;color:#007d53;font-weight:900}.status.break{background:#fff1c9;color:#a76d00}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:18px 0}.metric{background:#f3f8f9;padding:12px;border-radius:12px}.metric small{color:#657b8e;font-weight:800}.metric b{display:block;font-size:19px;margin:6px 0}.money{text-align:right;color:#fa5212;font-size:21px;font-weight:900}.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:16px}.actions button{background:#f1f7f8;color:#25465f}.actions .exit{background:#fff0f1;color:#e04b5c}.modal{position:fixed;inset:0;background:#17354b99;display:grid;place-items:center;z-index:8}.box{background:#fff;padding:24px;border-radius:18px;width:min(430px,94vw)}input{width:100%;padding:12px;border:1px solid var(--l);border-radius:9px;margin:6px 0 12px;font:inherit}.hidden{display:none}@media(max-width:800px){.side{display:none}.top{padding:0 16px}.main{padding:18px}.kpis{grid-template-columns:repeat(2,1fr)}.kpis .kpi:nth-child(5){display:none}.metrics{grid-template-columns:repeat(3,1fr)}.welcome{font-size:25px}}</style><body><header class=top><div class=brand><i>🕊</i> Oyun Kafe</div><div class=sp></div><span id=usr class=user></span><button id=out class="bell hidden">↪ Çıkış</button></header><div class=shell><aside class=side><button class="nav active">Ana Sayfa</button><button class=nav>Çocuklar</button><button class=nav>Üyelikler</button><button class=nav>Ödemeler</button><button class=nav>Rezervasyonlar</button><button class=nav>Raporlar</button><button class=nav>Ayarlar</button></aside><main class=main><section id=login class=box><h1>Giriş</h1><p class=muted>Merkezi Oyun Kafe yönetimi</p><input id=email placeholder=E-posta type=email><input id=pass placeholder=Şifre type=password><button class=primary onclick=signin()>Giriş yap</button><p id=error></p></section><section id=app class=hidden><h1 class=welcome>Hoş geldiniz, <span id=who>Yönetici</span> 👋</h1><p class=muted>Bugünkü oyun alanı durumunu buradan takip edebilirsiniz.</p><div class=buttons><button class=primary onclick=showAdd()>＋ Çocuk Kaydı</button><button class=orange>＋ Yeni Üyelik</button></div><section class=kpis><div class=kpi><span>OYUN ALANINDA</span><b id=all>0</b></div><div class=kpi><span>OYUNDA</span><b id=play>0</b></div><div class=kpi><span>MOLADA</span><b id=br>0</b></div><div class=kpi><span>BUGÜN GİRİŞ</span><b id=today>0</b></div><div class=kpi><span>BUGÜNKÜ CİRO</span><b>₺0</b></div></section><div class=head><h2>Oyun Alanında</h2><button class=primary onclick=showAdd()>+ Çocuk Kaydı</button></div><section id=cards class=cards></section></section></main></div><div id=modal class="modal hidden"><div class=box><h2>Yeni Çocuk Kaydı</h2><input id=child placeholder="Çocuğun adı"><input id=guardian placeholder="Veli adı"><input id=table placeholder="Masa (opsiyonel)"><button class=primary onclick=create()>Kaydı Başlat</button><button onclick=hide()>Vazgeç</button></div></div><script>const sb=supabase.createClient('https://wdknvlhtkimlkrmxuegd.supabase.co','sb_publishable_AEdSGBGd1i_qRFP_3ofpJQ_V9kw5dcN');let uid;const dur=x=>{let m=Math.max(0,Math.floor((Date.now()-new Date(x))/60000));return Math.floor(m/60)+' sa '+m%60+' dk'};async function load(){let{data:{user}}=await sb.auth.getUser();if(!user)return;uid=user.id;login.classList.add('hidden');app.classList.remove('hidden');usr.textContent=user.email;out.classList.remove('hidden');let{data:v,error}=await sb.from('visits').select('*,children(*)').in('status',['OYUNDA','MOLADA']).order('entered_at');if(error)return alert(error.message);all.textContent=v.length;play.textContent=v.filter(x=>x.status==='OYUNDA').length;br.textContent=v.filter(x=>x.status==='MOLADA').length;today.textContent=v.filter(x=>new Date(x.entered_at).toDateString()===new Date().toDateString()).length;cards.innerHTML=v.map(x=>`<article class="card ${x.status==='MOLADA'?'break':''}"><div class=head><div><div class=name>${x.children.first_name} ${x.children.last_name||''}</div><div class=muted>♟ Masa: ${x.table_no||'Atanmamış'} · Veli: ${x.children.guardian_first_name}</div></div><span class="status ${x.status==='MOLADA'?'break':''}">● ${x.status==='MOLADA'?'Molada':'Oyunda'}</span></div><div class=metrics><div class=metric><small>GİRİŞ SAATİ</small><b>${new Date(x.entered_at).toLocaleTimeString('tr-TR',{hour:'2-digit',minute:'2-digit'})}</b><span>Oyun alanına giriş</span></div><div class=metric><small>AKTİF SÜRE</small><b>${dur(x.entered_at)}</b><span>${x.status==='MOLADA'?'Mola nedeniyle durdu':'Ücretlendirme çalışıyor'}</span></div><div class=metric><small>MOLA</small><b>${x.status==='MOLADA'?'Devam ediyor':'0 dk'}</b><span>Toplam mola</span></div></div><div class=money>ŞU AN<br>₺0</div><div class=actions>${x.status==='OYUNDA'?`<button onclick="pause('${x.id}')">☕ Mola Başlat</button>`:`<button onclick="resume('${x.id}')">▶ Molayı Bitir</button>`}<button>Detay</button><button class=exit onclick="finish('${x.id}')">↪ Çıkış</button></div></article>`).join('')||'<div class=card>Aktif çocuk bulunmuyor.</div>'}async function create(){if(!child.value||!guardian.value)return;let{data:c,error}=await sb.from('children').insert({first_name:child.value,guardian_first_name:guardian.value,created_by:uid}).select().single();if(error)return alert(error.message);let{error:e}=await sb.from('visits').insert({child_id:c.id,session_id:'F-'+Date.now(),table_no:table.value||null,status:'OYUNDA',created_by:uid});if(e)return alert(e.message);hide();load()}async function pause(i){let{error}=await sb.from('visits').update({status:'MOLADA'}).eq('id',i);if(!error)error=(await sb.from('breaks').insert({visit_id:i})).error;if(error)return alert(error.message);load()}async function resume(i){let{data:b}=await sb.from('breaks').select('id').eq('visit_id',i).is('ended_at',null).single();if(b)await sb.from('breaks').update({ended_at:new Date().toISOString()}).eq('id',b.id);let{error}=await sb.from('visits').update({status:'OYUNDA'}).eq('id',i);if(error)return alert(error.message);load()}async function finish(i){if(!confirm('Çıkış yapılsın mı?'))return;await sb.from('visits').update({status:'ÇIKTI',exited_at:new Date().toISOString()}).eq('id',i);load()}function showAdd(){modal.classList.remove('hidden')}function hide(){modal.classList.add('hidden')}async function signin(){let{error:e}=await sb.auth.signInWithPassword({email:email.value,password:pass.value});if(e)error.textContent=e.message;else load()}out.onclick=async()=>{await sb.auth.signOut();location.reload()};sb.channel('sync').on('postgres_changes',{event:'*',schema:'public',table:'visits'},load).subscribe();load()</script></body></html>
