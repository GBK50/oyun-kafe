<!doctype html><html lang="tr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Oyun Kafe</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{margin:0;background:#f4f8fa;color:#18324b;font:16px system-ui}.top{padding:16px 6%;background:#fff;display:flex;gap:12px;justify-content:space-between}.wrap{max-width:1100px;margin:30px auto;padding:0 18px}.card{background:#fff;border:1px solid #dce7ec;border-radius:16px;padding:18px;margin:12px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:14px}button,input{font:inherit;padding:10px;border-radius:9px;border:1px solid #cbdce2}button{background:#108b84;color:#fff;font-weight:700;cursor:pointer}.warn{background:#d69200}.danger{background:#be4751}.muted{color:#60778a}.hidden{display:none}</style><body><header class="top"><b>🕊️ Oyun Kafe</b><span id=u></span><button id=o class=hidden>Çıkış</button></header><main class=wrap><section id=l class=card><h1>Giriş</h1><p class=muted>Tüm cihazlar aynı merkezi veriyi görür.</p><input id=e placeholder=E-posta type=email><input id=p placeholder=Şifre type=password><button onclick=g()>Giriş yap</button><p id=x></p></section><section id=a class=hidden><div class=card><h1>Oyun Alanı</h1><button onclick=n()>+ Çocuk Kaydı</button></div><div id=k class=grid></div></section></main><script>const s=supabase.createClient('https://wdknvlhtkimlkrmxuegd.supabase.co','sb_publishable_AEdSGBGd1i_qRFP_3ofpJQ_V9kw5dcN');let id;async function q(){let{data:{user}}=await s.auth.getUser();if(!user)return;id=user.id;l.classList.add('hidden');a.classList.remove('hidden');u.textContent=user.email;o.classList.remove('hidden');let{data:v,error}=await s.from('visits').select('*,children(*)').in('status',['OYUNDA','MOLADA']).order('entered_at');if(error)return alert(error.message);k.innerHTML=v.map(z=>`<article class=card><h2>${z.children.first_name} ${z.children.last_name||''}</h2><p>${z.table_no?'Masa: '+z.table_no:'Masa atanmamış'} · <b>${z.status}</b></p><p class=muted>Giriş: ${new Date(z.entered_at).toLocaleString('tr-TR')}</p>${z.status==='OYUNDA'?`<button class=warn onclick="m('${z.id}')">Mola Başlat</button>`:`<button onclick="r('${z.id}')">Molayı Bitir</button>`}<button class=danger onclick="c('${z.id}')">Çıkış</button></article>`).join('')||'<div class=card>Aktif kayıt yok.</div>'}async function n(){let f=prompt('Çocuğun adı'),g=prompt('Veli adı');if(!f||!g)return;let{data:d,error}=await s.from('children').insert({first_name:f,guardian_first_name:g,created_by:id}).select().single();if(error)return alert(error.message);let{error:E}=await s.from('visits').insert({child_id:d.id,session_id:'F-'+Date.now(),status:'OYUNDA',entered_at:new Date().toISOString(),created_by:id});if(E)return alert(E.message);q()}async function m(v){let{error:E}=await s.from('visits').update({status:'MOLADA'}).eq('id',v);if(!E)E=(await s.from('breaks').insert({visit_id:v,started_at:new Date().toISOString()})).error;if(E)return alert(E.message);q()}async function r(v){let{data:b}=await s.from('breaks').select('id').eq('visit_id',v).is('ended_at',null).single(),E=b&&(await s.from('breaks').update({ended_at:new Date().toISOString()}).eq('id',b.id)).error;if(!E)E=(await s.from('visits').update({status:'OYUNDA'}).eq('id',v)).error;if(E)return alert(E.message);q()}async function c(v){if(!confirm('Seans kapatılsın mı?'))return;let{error:E}=await s.from('visits').update({status:'ÇIKTI',exited_at:new Date().toISOString()}).eq('id',v);if(E)return alert(E.message);q()}async function g(){let{error:E}=await s.auth.signInWithPassword({email:e.value,password:p.value});if(E)x.textContent=E.message;else q()}o.onclick=async()=>{await s.auth.signOut();location.reload()};s.channel('central').on('postgres_changes',{event:'*',schema:'public',table:'visits'},q).subscribe();q()</script></body></html>
