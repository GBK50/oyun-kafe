<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Oyun Kafe</title>
<style>
:root{--teal:#0d9c9a;--navy:#16395b;--ink:#1b2b3c;--muted:#6e7d8d;--line:#dfe8ed;--bg:#f4f8fa;--yellow:#fff3be;--red:#d55252}*{box-sizing:border-box}body{margin:0;font:14px Inter,system-ui,-apple-system,Segoe UI,sans-serif;color:var(--ink);background:var(--bg)}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0;border-radius:10px;padding:10px 14px;font-weight:700}.app{min-height:100vh}.top{height:68px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 28px;gap:18px;position:sticky;top:0;z-index:5}.brand{font-size:20px;font-weight:850;color:var(--navy)}.brand i{display:inline-grid;place-items:center;background:var(--teal);color:#fff;border-radius:9px;width:30px;height:30px;font-style:normal;margin-right:7px}.spacer{flex:1}.user{color:var(--muted);font-size:12px}.user b{display:block;color:var(--ink);font-size:14px}.bell{position:relative;background:#eef7f7;color:var(--teal);font-size:18px}.dot{position:absolute;right:8px;top:7px;width:7px;height:7px;border-radius:50%;background:#ee6b55}.shell{display:flex}.side{width:220px;padding:20px 14px;background:#fff;min-height:calc(100vh - 68px);border-right:1px solid var(--line);position:sticky;top:68px;align-self:flex-start}.nav{width:100%;text-align:left;background:transparent;color:#617080;margin:3px 0}.nav.active,.nav:hover{background:#e4f5f4;color:#087e7d}.main{flex:1;padding:28px;max-width:1550px;margin:auto;width:100%}.page-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px}.page-head h1{margin:0;font-size:25px}.page-head p{margin:5px 0 0;color:var(--muted)}.primary{background:var(--teal);color:#fff}.dark{background:var(--navy);color:#fff}.soft{background:var(--yellow);color:#6c5411}.ghost{background:#edf3f6;color:#37516a}.danger{background:#fff0f0;color:var(--red)}.kpis{display:grid;grid-template-columns:repeat(6,1fr);gap:13px;margin-bottom:23px}.kpi,.card,.panel{background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:0 4px 15px #16395b08}.kpi{padding:15px}.kpi span{color:var(--muted);font-size:12px}.kpi b{display:block;font-size:23px;margin-top:8px}.sessions{display:grid;grid-template-columns:repeat(auto-fill,minmax(355px,1fr));gap:16px}.session{padding:18px;position:relative;overflow:hidden}.session:hover{border-color:#91d5d2;box-shadow:0 7px 20px #0d9c9a16}.row{display:flex;align-items:center;gap:10px}.avatar{width:42px;height:42px;border-radius:13px;background:#d8f0ef;color:#077b7a;display:grid;place-items:center;font-size:17px;font-weight:800}.child-name{font-size:17px;font-weight:800}.sub{color:var(--muted);font-size:12px;margin-top:3px}.badge{margin-left:auto;background:#e8f5f4;color:#087e7d;padding:5px 9px;border-radius:99px;font-size:11px;font-weight:800}.badge.break{background:#fff2ca;color:#9a7315}.meta{display:flex;gap:7px;flex-wrap:wrap;margin:15px 0}.pill{background:#f2f6f8;border-radius:99px;padding:5px 9px;font-size:12px}.metrics{display:grid;grid-template-columns:1.2fr 1fr;gap:10px;margin:13px 0}.metric{padding:13px;border-radius:12px;background:#f6fafb}.metric.price{background:#eef8f7}.metric label,.section-label{font-size:10px;letter-spacing:.07em;color:var(--muted);font-weight:800}.metric strong{font-size:21px;display:block;margin:4px 0}.meter{margin:13px 0}.meter-line{display:flex;justify-content:space-between;color:var(--muted);font-size:12px}.bar{height:7px;background:#e5edf0;border-radius:99px;margin-top:7px;overflow:hidden}.bar i{display:block;height:100%;background:var(--teal);border-radius:99px}.actions{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:15px}.actions button{padding:9px 5px;font-size:11px;background:#f0f6f7;color:#365066}.actions button:last-child{background:var(--navy);color:#fff}.actions button:hover{filter:brightness(.97)}.profile{max-width:870px;margin:auto}.profile-top{padding:21px}.back{padding:7px 0;background:transparent;color:var(--teal)}.profile-grid{display:grid;grid-template-columns:1.25fr 1fr;gap:15px}.profile-grid>.card{padding:19px}.action-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.action-grid button{min-height:70px;background:#eef6f7;color:#315068}.action-grid button:last-child{background:var(--navy);color:#fff}.table{width:100%;border-collapse:collapse;background:#fff;border-radius:14px;overflow:hidden}.table th,.table td{text-align:left;padding:13px;border-bottom:1px solid var(--line)}.table th{font-size:11px;color:var(--muted);background:#f7fafb}.toolbar{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:16px}.toolbar input{padding:10px 12px;border:1px solid var(--line);border-radius:10px;min-width:230px}.filter{background:#fff;color:#506477;border:1px solid var(--line)}.empty{padding:35px;text-align:center;color:var(--muted)}.modal-bg{position:fixed;inset:0;background:#17324a66;display:grid;place-items:center;padding:18px;z-index:10}.modal{background:#fff;border-radius:18px;width:min(590px,100%);max-height:90vh;overflow:auto;box-shadow:0 20px 65px #10263855}.modal-head{padding:20px 22px;border-bottom:1px solid var(--line)}.modal-head h2{margin:0;font-size:20px}.modal-head p{color:var(--muted);margin:5px 0 0}.modal-body{padding:20px 22px}.modal-foot{padding:16px 22px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:9px;position:sticky;bottom:0;background:#fff}.form{display:grid;grid-template-columns:1fr 1fr;gap:13px}.form label{font-size:12px;font-weight:750;color:#41566b}.form input,.form textarea,.form select{width:100%;padding:10px;margin-top:5px;border:1px solid var(--line);border-radius:9px;color:var(--ink);background:#fff}.form textarea{min-height:70px;resize:vertical}.full{grid-column:1/-1}.hint{background:#edf8f7;color:#386765;padding:11px;border-radius:10px;font-size:12px;margin-bottom:15px}.choice{display:flex;gap:8px;flex-wrap:wrap}.choice button{background:#eff4f6;color:#466072}.choice button.on{background:#d7f0ef;color:#057e7d;outline:2px solid #8ed4d2}.timeline{position:relative;margin-left:8px;padding-left:23px}.timeline:before{content:"";position:absolute;left:0;top:5px;bottom:5px;width:2px;background:#dce9eb}.event{position:relative;padding:0 0 18px}.event:before{content:"";position:absolute;left:-28px;top:4px;width:10px;height:10px;background:var(--teal);border:3px solid #d9f2f1;border-radius:50%}.event b{display:block}.event small{color:var(--muted)}.toast{position:fixed;bottom:22px;right:22px;background:#153a5b;color:#fff;padding:14px 18px;border-radius:11px;box-shadow:0 8px 25px #1238;z-index:20}.notice{position:absolute;right:24px;top:62px;width:330px;background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 10px 30px #1232;z-index:7;padding:12px}.notice h3{margin:5px}.notice-item{padding:11px;border-bottom:1px solid var(--line);font-size:12px}.cal{display:grid;grid-template-columns:repeat(7,1fr);background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden}.day{min-height:88px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:8px;color:var(--muted)}.res{background:#dff3f2;color:#087876;border-radius:6px;padding:4px;margin-top:5px;font-size:10px}.restricted{padding:75px;text-align:center}.restricted h2{color:var(--navy)}
 .menu-toggle{display:none;background:#eaf4f5;color:var(--teal);font-size:20px;padding:7px 11px}.nav-backdrop{display:none}.side{display:flex;flex-direction:column}.nav-list{display:flex;flex-direction:column}.session-control{margin-top:auto;border-top:1px solid var(--line);padding:15px 0 0}.session-control small{display:block;color:var(--muted);margin:0 0 8px 8px}.logout{width:100%;text-align:left;background:#fff1f1;color:#b84646}.login-screen{min-height:100vh;display:grid;place-items:center;padding:20px;background:linear-gradient(135deg,#eff8f8,#f7f9fb)}.login-card{width:min(430px,100%);padding:34px;text-align:center}.login-card .brand{margin-bottom:22px}.role-select{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:20px 0}.role-select button{background:#f0f6f7;color:#40596b;min-height:80px}.role-select button.on{background:#d9f1f0;color:#087e7d;outline:2px solid #91d6d4}@media(max-width:1000px){.kpis{grid-template-columns:repeat(3,1fr)}.side{width:170px}.action-grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:700px){.top{padding:0 14px}.menu-toggle{display:block}.side{display:flex;position:fixed;z-index:15;top:68px;left:0;width:260px;height:calc(100vh - 68px);min-height:0;transform:translateX(-105%);transition:transform .2s ease;box-shadow:12px 0 35px #16395b24}.side.open{transform:translateX(0)}.nav-backdrop.open{display:block;position:fixed;inset:68px 0 0;background:#17324a55;z-index:14}.main{padding:17px}.kpis{grid-template-columns:repeat(2,1fr)}.sessions{grid-template-columns:1fr}.profile-grid{grid-template-columns:1fr}.actions{grid-template-columns:repeat(2,1fr)}.form{grid-template-columns:1fr}.action-grid{grid-template-columns:repeat(2,1fr)}.table{font-size:12px}.table th:nth-child(n+5),.table td:nth-child(n+5){display:none}.user{display:none}}
</style></head><body><div id="app"></div><script>
const D=new Date(), iso=(m=0)=>new Date(Date.now()+m*60000).toISOString(), time=x=>new Date(x).toLocaleTimeString('tr-TR',{hour:'2-digit',minute:'2-digit'}), money=n=>'₺'+n.toLocaleString('tr-TR');
const seed={role:'Yönetici',page:'Ana Sayfa',selected:null,modal:null,toast:null,notices:[{text:'Kerem Oğuz Köse için alarm süresi doldu.',child:1,read:false},{text:'Masa 7 için yaklaşan rezervasyon var.',read:false}],pricing:{first:300,half:100},children:[
{id:1,name:'Kerem Oğuz',surname:'Köse',guardian:'Hikmet',gsurname:'Köse',phone:'0539 482 91 93',table:'7',location:'İç Alan',sid:'F-000886',entered:iso(-72),status:'OYUNDA',creator:'Senanur Sarak',note:'Alerji bilgisi yok.',member:false,breaks:[],logs:[['Oyuna Girdi',iso(-72),'Giriş kaydı oluşturuldu.'],['Masa Değiştirildi',iso(-59),'Eski: Masa 5 · Yeni: Masa 7']]},
{id:2,name:'Milaş',surname:'Çakır',guardian:'Derya',gsurname:'Çakır',phone:'0532 800 44 22',table:'38',location:'Bahçe',sid:'F-000883',entered:iso(-43),status:'MOLADA',creator:'Ayşe Yılmaz',note:'',member:true,breaks:[{start:iso(-12)}],logs:[['Oyuna Girdi',iso(-43),'Üyelik ile giriş yaptı.'],['Molaya Çıktı',iso(-12),'Mola başlatıldı.']]},
{id:3,name:'Ayaz',surname:'Demir',guardian:'Elif',gsurname:'Demir',phone:'',table:'7',location:'İç Alan',sid:'F-000885',entered:iso(-105),status:'OYUNDA',creator:'Senanur Sarak',note:'',member:false,breaks:[{start:iso(-70),end:iso(-65)}],logs:[['Oyuna Girdi',iso(-105),'Giriş kaydı oluşturuldu.'],['Molaya Çıktı',iso(-70),'Mola başlatıldı.'],['Moladan Döndü',iso(-65),'Mola sonlandırıldı.']]}
],relationships:[{a:1,b:2,type:'Kardeş'},{a:1,b:3,type:'Arkadaş'}],payments:[{date:iso(-1440),child:'Deniz Efe Kaya',guardian:'Mert Kaya',type:'Oyun seansı',amount:500,method:'Kart',staff:'Senanur Sarak'}],reservations:[{id:1,type:'Doğum Günü',child:'Mina',guardian:'Ceren Akın',date:D.toISOString().slice(0,10),start:'16:00',end:'18:00',count:12,table:'12',amount:3500,status:'Kısmi Ödendi',note:''}],memberships:[{child:'Milaş Çakır',pack:'3 Aylık',end:'14 Aralık 2026',price:1500}],staff:[{name:'Senanur Sarak',phone:'0532 211 23 45',username:'senanur',role:'Yönetici',status:'Aktif'},{name:'Ayşe Yılmaz',phone:'0532 342 44 55',username:'ayse',role:'Personel',status:'Aktif'}],settings:{'1 Aylık':650,'3 Aylık':1500,'6 Aylık':2750,'9 Aylık':3900,'12 Aylık':5000}};
let S=JSON.parse(localStorage.getItem('oyunKafe')||'null')||seed;function save(){localStorage.setItem('oyunKafe',JSON.stringify(S));render()}function name(c){return c.name+' '+c.surname}function active(c){return c.status!=='ÇIKTI'}function mins(c){let end=c.status==='ÇIKTI'?new Date(c.exited):new Date(),total=Math.max(0,(end-new Date(c.entered))/60000);let br=c.breaks.reduce((n,b)=>n+((new Date(b.end||end)-new Date(b.start))/60000),0);return Math.floor(total-br)}function duration(n){return n<60?n+' dk':Math.floor(n/60)+' sa '+n%60+' dk'}function price(c){return c.member?0:S.pricing.first+(Math.max(0,Math.ceil((mins(c)-60)/30))*S.pricing.half)}function log(c,title,desc){c.logs.unshift([title,new Date().toISOString(),desc])}function child(){return S.children.find(x=>x.id===S.selected)}function toast(t){S.toast=t;render();setTimeout(()=>{S.toast=null;render()},2600)}
function AppShell(content){let nav=['Ana Sayfa','Çocuklar'];if(S.role==='Yönetici')nav.push('Üyelikler','Ödemeler','Rezervasyonlar','Raporlar','Personel','Ayarlar');return `<div class=app><header class=top><button class=menu-toggle aria-label="Menüyü aç" onclick="S.mobileMenu=!S.mobileMenu;render()">☰</button><div class=brand><i>○</i>Oyun Kafe</div><div class=spacer></div><div class=user><b>${S.role==='Yönetici'?'Senanur Sarak':'Ayşe Yılmaz'}</b>${S.role}</div><button class=bell onclick="S.showNotices=!S.showNotices;render()">♟${S.notices.some(n=>!n.read)?'<i class=dot></i>':''}</button><select onchange="S.role=this.value;S.page='Ana Sayfa';S.selected=null;save()"><option ${S.role==='Yönetici'?'selected':''}>Yönetici</option><option ${S.role==='Personel'?'selected':''}>Personel</option></select></header>${S.showNotices?Notifications():''}<div class="nav-backdrop ${S.mobileMenu?'open':''}" onclick="S.mobileMenu=false;render()"></div><div class=shell><aside class="side ${S.mobileMenu?'open':''}"><div class=nav-list>${nav.map(n=>`<button class="nav ${S.page===n?'active':''}" onclick="go('${n}');S.mobileMenu=false">${n}</button>`).join('')}</div><div class=session-control><small>Aktif kullanıcı: ${S.role}</small><button class=logout onclick="logout()">↪ Oturumu Kapat</button></div></aside><main class=main>${content}</main></div>${S.modal?Modal():''}${S.toast?`<div class=toast>${S.toast}</div>`:''}</div>`}
function Login(){return `<div class=login-screen><section class="card login-card"><div class=brand><i>○</i>Oyun Kafe</div><h1>Hoş Geldiniz</h1><p class=sub>Devam etmek için rolünüzü seçin.</p><div class=role-select><button class="${S.loginRole==='Yönetici'||!S.loginRole?'on':''}" onclick="S.loginRole='Yönetici';render()">Yönetici</button><button class="${S.loginRole==='Personel'?'on':''}" onclick="S.loginRole='Personel';render()">Personel</button></div><button class=primary style="width:100%" onclick="login()">Oturumu Aç</button></section></div>`}
function Notifications(){return `<div class=notice><h3>Bildirimler</h3>${S.notices.filter(n=>S.role==='Yönetici'||!n.text.includes('ödeme')).map(n=>`<div class=notice-item onclick="${n.child?`openChild(${n.child})`:''}">${n.text}</div>`).join('')}<button class=ghost onclick="S.notices.forEach(n=>n.read=true);S.showNotices=false;save()">Tümünü Okundu İşaretle</button></div>`}
function Kpi(label,value){return `<div class=kpi><span>${label}</span><b>${value}</b></div>`}function Dashboard(){let a=S.children.filter(active),play=a.filter(c=>c.status==='OYUNDA'),br=a.filter(c=>c.status==='MOLADA'),selected=Object.keys(S.selectedChildren||{}).length;let ks=[Kpi('Şu Anda İçeride',a.length),Kpi('Oyunda',play.length),Kpi('Molada',br.length),Kpi(S.role==='Yönetici'?'Bugün Çıkan':'Bugün Giriş Yapan Çocuk',S.children.length-a.length)];if(S.role==='Yönetici')ks.push(Kpi('Bugünkü Ciro',money(S.payments.filter(p=>p.date.slice(0,10)===D.toISOString().slice(0,10)).reduce((n,p)=>n+p.amount,0))),Kpi('Aktif Üyelik',S.memberships.length));return AppShell(`<div class=page-head><div><h1>Ana Sayfa</h1><p>Aktif çocuk seansları ve operasyon takibi</p></div><button class=primary onclick="show('newChild')">+ Yeni Çocuk</button></div><section class=kpis>${ks.join('')}</section><div class=page-head><div><h2>Aktif Seanslar</h2><p>${S.bulkMode?'Kapatmak istediğiniz çocukları seçin.':'Çocuk kartına dokunarak profili açın.'}</p></div><div class=toolbar>${S.bulkMode?`<button class=dark onclick="show('bulkExit')" ${selected?'':'disabled'}>Seçilenleri Kapat (${selected})</button><button class=ghost onclick="cancelBulk()">Vazgeç</button>`:`<button class=ghost onclick="startBulk()">☑ Çocukları Seç</button>`}</div></div><section class=sessions>${a.map(Session).join('')||'<div class=empty>Aktif seans bulunmuyor.</div>'}</section>`)}
function Session(c){let m=mins(c),p=price(c),progress=(m<=60?m/60:((m-60)%30)/30)*100,next=c.member?'Üyelik kapsamında':money(p+S.pricing.half),checked=S.selectedChildren?.[c.id]?'checked':'';return `<article class="card session" onclick="${S.bulkMode?`toggleChild(${c.id})`:`openChild(${c.id})`}"><div class=row>${S.bulkMode?`<input class=select-child type=checkbox ${checked} onclick="event.stopPropagation();toggleChild(${c.id})" aria-label="${name(c)} seç">`:''}<div class=avatar>${c.name[0]}</div><div><div class=child-name>${name(c)}</div><div class=sub>${c.guardian} ${c.gsurname} · ${c.phone||'Telefon eklenmemiş'}</div></div><div class="badge ${c.status==='MOLADA'?'break':''}">${c.status}</div></div><div class=meta><span class=pill>Seans ID · ${c.sid}</span><span class=pill>${c.table?'Masa '+c.table:'Masasız'}</span><span class=pill>${c.location}</span></div><div class=metrics><div class=metric><label>AKTİF SÜRE</label><strong>${duration(m)}</strong><small>Giriş ${time(c.entered)}</small></div><div class="metric price"><label>ŞU AN</label><strong>${c.member?'Üye':money(p)}</strong><small>${c.status==='MOLADA'?'Sayaç durdu':'Sayaç çalışıyor'}</small></div></div><div class=meter><div class=meter-line><span>${c.member?'Üyelik aktif':'Bu fiyata '+(m<=60?60-m:30-(m-60)%30)+' dk daha'}</span><span>${next}</span></div><div class=bar><i style="width:${progress}%"></i></div></div><div class=sub>Kaydı Açan: ${c.creator}</div>${S.bulkMode?'':`<div class=actions onclick="event.stopPropagation()">${['Düzenle','Kardeş Ekle','Arkadaş Ekle','Alarm Kur','Masa Taşı','Hareketler',c.status==='MOLADA'?'Molayı Bitir':'Molaya Çıkar','Çıkış / Hesap →'].map(x=>`<button onclick="act('${x}',${c.id})">${x}</button>`).join('')}</div>`}</article>`}
function Profile(){let c=child();if(!c)return Dashboard();let m=mins(c), group=S.children.filter(x=>active(x)&&x.table&&x.table===c.table);return AppShell(`<div class=profile><button class=back onclick="go('Ana Sayfa')">← Ana Sayfa</button><section class="card profile-top"><div class=row><div class=avatar>${c.name[0]}</div><div><div class=child-name>${name(c)}</div><div class=sub>${c.guardian} ${c.gsurname} · ${c.phone||'Telefon eklenmemiş'}</div></div><span class=badge>${c.table?'Masa '+c.table:'Masasız'}</span></div><div class=meta><span class=pill>Seans ID · ${c.sid}</span><span class=pill>${c.location}</span><span class="badge ${c.status==='MOLADA'?'break':''}">${c.status}</span></div></section><div class=profile-grid style="margin-top:15px"><section class=card><div class=metrics><div class=metric><label>AKTİF SÜRE</label><strong>${duration(m)}</strong><small>Giriş: ${time(c.entered)}</small></div><div class="metric price"><label>ŞU AN</label><strong>${c.member?'Üyelik':money(price(c))}</strong><small>${c.status==='MOLADA'?'Sayaç durdu':'Sayaç çalışıyor'}</small></div></div><div class=meter><div class=meter-line><span>${c.member?'Üyelik kapsamında':(m<=60?60-m:30-(m-60)%30)+' dk daha bu fiyat'}</span><span>${c.member?'Aktif':money(price(c)+S.pricing.half)}</span></div><div class=bar><i style="width:${(m<=60?m/60:((m-60)%30)/30)*100}%"></i></div></div><div class=sub>Kaydı Açan: ${c.creator}</div></section><section class=card><div class=section-label>MASA GRUBU</div><h3>${c.table?'Masa '+c.table:'Masasız'}</h3><div class=sub>${group.length} çocuk</div>${group.map(x=>`<div class=row style="margin-top:8px"><div class=avatar style="width:27px;height:27px;border-radius:8px;font-size:12px">${x.name[0]}</div>${name(x)}</div>`).join('')}</section></div><section class=card style="padding:16px;margin-top:15px"><div class=action-grid>${['Düzenle','Kardeş Ekle','Arkadaş Ekle','Alarm Kur','Masa Taşı','Hareketler',c.status==='MOLADA'?'Molayı Bitir':'Molaya Çıkar','Çıkış / Hesap →'].map(x=>`<button onclick="act('${x}',${c.id})">${x}</button>`).join('')}</div></section></div>`)}
function Children(){let q=(S.query||'').toLocaleLowerCase('tr');let list=S.children.filter(c=>[name(c),c.guardian,c.phone,c.sid,c.table].join(' ').toLocaleLowerCase('tr').includes(q));return AppShell(`<div class=page-head><div><h1>Çocuklar</h1><p>Aktif ve geçmiş çocuk kayıtları</p></div><button class=primary onclick="show('newChild')">+ Yeni Çocuk</button></div><div class=toolbar><input placeholder="Çocuk, veli, telefon, seans veya masa ara" value="${S.query||''}" oninput="S.query=this.value;render()">${['Tümü','Aktif','Oyunda','Molada','Üye'].map(x=>`<button class=filter onclick="S.query='${x==='Aktif'?'':S.query||''}';render()">${x}</button>`).join('')}</div><table class=table><thead><tr><th>Çocuk</th><th>Veli</th><th>Seans</th><th>Masa</th><th>Durum</th><th>İşlem</th></tr></thead><tbody>${list.map(c=>`<tr><td><b>${name(c)}</b></td><td>${c.guardian} ${c.gsurname}</td><td>${c.sid}</td><td>${c.table?'Masa '+c.table:'Masasız'}</td><td><span class="badge ${c.status==='MOLADA'?'break':''}">${c.status}</span></td><td><button class=ghost onclick="openChild(${c.id})">Profili Aç</button></td></tr>`).join('')}</tbody></table>`)}
function restricted(){return AppShell(`<div class=card restricted><h2>Erişim Yetkisi Yok</h2><p>Bu sayfaya erişim yetkiniz bulunmamaktadır.</p></div>`)}
function Payments(){if(S.role!=='Yönetici')return restricted();let total=S.payments.reduce((n,p)=>n+p.amount,0);return AppShell(`<div class=page-head><div><h1>Ödemeler</h1><p>Tahsilat ve ödeme hareketleri</p></div></div><div class=kpis>${Kpi('Bugün',money(total))}${Kpi('Bu Hafta',money(total))}${Kpi('Bu Ay',money(total))}${Kpi('Bekleyen',money(S.children.filter(active).reduce((n,c)=>n+price(c),0)))}</div><table class=table><thead><tr><th>Tarih</th><th>Çocuk</th><th>Veli</th><th>İşlem</th><th>Tutar</th><th>Ödeme Yöntemi</th><th>Personel</th></tr></thead><tbody>${S.payments.map(p=>`<tr><td>${new Date(p.date).toLocaleDateString('tr-TR')}</td><td>${p.child}</td><td>${p.guardian}</td><td>${p.type}</td><td>${money(p.amount)}</td><td>${p.method}</td><td>${p.staff}</td></tr>`).join('')}</tbody></table>`)}
function Memberships(){if(S.role!=='Yönetici')return restricted();return AppShell(`<div class=page-head><div><h1>Üyelikler</h1><p>Aktif üyelikler ve paket satışları</p></div><button class=primary onclick="show('membership')">+ Üyelik Sat</button></div><table class=table><thead><tr><th>Çocuk</th><th>Paket</th><th>Bitiş Tarihi</th><th>Satış Fiyatı</th></tr></thead><tbody>${S.memberships.map(x=>`<tr><td>${x.child}</td><td>${x.pack}</td><td>${x.end}</td><td>${money(x.price)}</td></tr>`).join('')}</tbody></table>`)}
function Reservations(){if(S.role!=='Yönetici')return restricted();let cells=Array.from({length:28},(_,i)=>`<div class=day>${i+1}${i===D.getDate()-1?S.reservations.map(r=>`<div class=res>${r.start} · ${r.child}</div>`).join(''):''}</div>`).join('');return AppShell(`<div class=page-head><div><h1>Rezervasyonlar</h1><p>Ay · Hafta · Gün görünümü</p></div><button class=primary onclick="show('reservation')">+ Yeni Rezervasyon</button></div><div class=toolbar><button class=primary>Ay</button><button class=filter>Hafta</button><button class=filter>Gün</button></div><div class=cal>${cells}</div><br><table class=table><thead><tr><th>Tarih</th><th>Tür</th><th>Çocuk</th><th>Veli</th><th>Masa</th><th>Durum</th><th>İşlem</th></tr></thead><tbody>${S.reservations.map((r,i)=>`<tr><td>${r.date} ${r.start}</td><td>${r.type}</td><td>${r.child}</td><td>${r.guardian}</td><td>${r.table}</td><td>${r.status}</td><td><button class=ghost>Detayları Gör</button> <button class=danger onclick="cancelReservation(${i})">İptal Et</button></td></tr>`).join('')}</tbody></table>`)}
function Reports(){if(S.role!=='Yönetici')return restricted();let revenue=S.payments.reduce((n,p)=>n+p.amount,0);return AppShell(`<div class=page-head><div><h1>Raporlar</h1><p>Günlük operasyon ve gelir özeti</p></div><div class=toolbar><button class=primary>Bugün</button><button class=filter>Dün</button><button class=filter>Bu Hafta</button><button class=filter>Bu Ay</button></div></div><div class=kpis>${Kpi('Günlük Çocuk Sayısı',S.children.length)}${Kpi('Günlük Ciro',money(revenue))}${Kpi('Oyun Ücretleri',money(revenue))}${Kpi('Üyelik Satışları',money(S.memberships.reduce((n,x)=>n+x.price,0)))}</div><section class=card style="padding:18px"><h3>Günlük Çocuk Listesi</h3><table class=table><thead><tr><th>Çocuk</th><th>Giriş</th><th>Çıkış</th><th>Masa</th><th>Üyelik</th><th>Net Oyun Süresi</th></tr></thead><tbody>${S.children.map(c=>`<tr><td>${name(c)}</td><td>${time(c.entered)}</td><td>${c.exited?time(c.exited):'İçeride'}</td><td>${c.table||'—'}</td><td>${c.member?'Üye':'Üye Değil'}</td><td>${duration(mins(c))}</td></tr>`).join('')}</tbody></table></section>`)}
function Staff(){if(S.role!=='Yönetici')return restricted();return AppShell(`<div class=page-head><div><h1>Personel</h1><p>Yetki ve durum yönetimi</p></div><button class=primary onclick="show('staff')">+ Personel Ekle</button></div><table class=table><thead><tr><th>Ad Soyad</th><th>Telefon</th><th>Kullanıcı Adı</th><th>Rol</th><th>Durum</th><th>İşlem</th></tr></thead><tbody>${S.staff.map((x,i)=>`<tr><td>${x.name}</td><td>${x.phone}</td><td>${x.username}</td><td>${x.role}</td><td><span class=badge>${x.status}</span></td><td><button class=ghost onclick="S.staff[${i}].status=S.staff[${i}].status==='Aktif'?'Pasif':'Aktif';save()">Durumu Değiştir</button></td></tr>`).join('')}</tbody></table>`)}
function Settings(){if(S.role!=='Yönetici')return restricted();return AppShell(`<div class=page-head><div><h1>Ayarlar</h1><p>Fiyatlandırma, üyelik paketleri ve genel ayarlar</p></div></div><section class=card style="padding:20px;margin-bottom:16px"><h2>Fiyatlandırma</h2><div class=form><label>İlk 1 Saat<input type=number value=${S.pricing.first} onchange="S.pricing.first=+this.value;save()"></label><label>Her Ek 30 Dakika<input type=number value=${S.pricing.half} onchange="S.pricing.half=+this.value;save()"></label></div><div class=hint style="margin-top:15px">0–60 dk → ${money(S.pricing.first)} · 61–90 dk → ${money(S.pricing.first+S.pricing.half)} · 91–120 dk → ${money(S.pricing.first+2*S.pricing.half)}</div></section><section class=card style="padding:20px"><h2>Üyelik Paketleri</h2><div class=form>${Object.entries(S.settings).map(([k,v])=>`<label>${k}<input type=number value=${v} onchange="S.settings['${k}']=+this.value;save()"></label>`).join('')}</div></section>`)}
function Modal(){let c=child(), type=S.modal;let title={newChild:'Yeni Çocuk',edit:'Canlı Kayıt Düzenle',sibling:'Hızlı Kardeş Kaydı',friend:'Hızlı Arkadaş Kaydı',alarm:'Alarm Kur',move:'Masa Taşı',history:'Hareket Geçmişi',break:'Mola Başlangıcı',exit:'Çıkış Hesabı',membership:'Üyelik Sat',reservation:'Yeni Rezervasyon',staff:'Personel Ekle'}[type];let body='';if(type==='history')body=`<div class=hint>${name(c)} · ${c.sid} · ${c.table?'Masa '+c.table:'Masasız'}<br>Toplam yapılan mola süresi: ${duration(c.breaks.reduce((n,b)=>n+((new Date(b.end||Date.now())-new Date(b.start))/60000),0))}</div><div class=timeline>${c.logs.map(x=>`<div class=event><b>${x[0]}</b><small>${time(x[1])} · ${x[2]}</small></div>`).join('')}</div>`;else if(type==='alarm')body=`<div class=choice><button onclick="S.alarm=30;render()" class="${S.alarm===30?'on':''}">30 dakika sonra</button><button onclick="S.alarm=60;render()" class="${S.alarm===60?'on':''}">1 saat sonra</button><button onclick="S.alarm=90;render()" class="${S.alarm===90?'on':''}">Bir sonraki yarım saat</button></div><div class=form style="margin-top:15px"><label class=full>Özel süre<input type=number placeholder="XXX dakika sonra" value="${S.alarm||''}" onchange="S.alarm=+this.value"></label></div>`;else if(type==='move')body=`<div class=hint>Boş bırakırsanız çocuk masasız olur.</div><div class=form><label class=full>Yeni masa numarası<input id=moveTable value="${c.table||''}" placeholder="Örn. 8"></label></div>`;else if(type==='break')body=`<div class=hint><b>${name(c)} Molaya Çıkacak</b><br>Molanın başladığı bugünkü saati seçin. Mola başladığında aktif süre duracaktır.</div><div class=choice>${[['Şimdi',0],['5 Dk Önce',-5],['10 Dk Önce',-10]].map(([x,v])=>`<button class="${S.breakOffset===v?'on':''}" onclick="S.breakOffset=${v};render()">${x}</button>`).join('')}</div>`;else if(type==='exit')body=`<div class=hint><b>${name(c)}</b><br>${duration(mins(c))} aktif oyun · molalar hariç<br>Tarife: İlk 1 saat ${money(S.pricing.first)}, her ek 30 dk ${money(S.pricing.half)}</div>${S.role==='Yönetici'?`<div class=metric price><label>ÖDENECEK TUTAR</label><strong>${c.member?'Üyelik kapsamında':money(price(c))}</strong></div><div class=choice style="margin-top:15px">${['Nakit','Kart','Havale/EFT'].map(x=>`<button class="${S.payMethod===x?'on':''}" onclick="S.payMethod='${x}';render()">${x}</button>`).join('')}</div>`:'<p>Seansı kapatmak için işlemi onaylayın. Ödeme tutarı ve finansal bilgiler yetkiniz kapsamında gösterilmez.</p>'}<div class=hint style="margin-top:15px">Onaydan sonra seans kapanır, bileklik havuza döner ve makbuz hareketlere eklenir.</div>`;else if(type==='membership')body=`<div class=form><label class=full>Çocuk<select id=memChild>${S.children.map(x=>`<option>${name(x)}</option>`).join('')}</select></label><label>Paket<select id=memPack>${Object.keys(S.settings).map(x=>`<option>${x}</option>`).join('')}</select></label><label>Ödeme yöntemi<select id=memMethod><option>Nakit</option><option>Kart</option><option>Havale/EFT</option></select></label></div>`;else if(type==='reservation')body=`<div class=form><label>Rezervasyon Türü<select id=rType>${['Doğum Günü','Grup','Okul','Özel Etkinlik','Diğer'].map(x=>`<option>${x}</option>`).join('')}</select></label><label>Çocuk Adı<input id=rChild required></label><label>Veli Adı<input id=rGuard required></label><label>Veli Telefon<input id=rPhone></label><label>Tarih<input id=rDate type=date value="${D.toISOString().slice(0,10)}"></label><label>Başlangıç Saati<input id=rStart type=time value="16:00"></label><label>Bitiş Saati<input id=rEnd type=time value="18:00"></label><label>Çocuk Sayısı<input id=rCount type=number value=1></label><label>Masa No<input id=rTable></label><label>Ücret<input id=rAmount type=number></label><label>Ödeme Durumu<select id=rStatus><option>Ödenmedi</option><option>Kısmi Ödendi</option><option>Ödendi</option></select></label><label class=full>Not<textarea id=rNote></textarea></label></div>`;else if(type==='staff')body=`<div class=form><label>Ad Soyad<input id=sName></label><label>Telefon<input id=sPhone></label><label>Kullanıcı adı<input id=sUser></label><label>Şifre<input type=password></label><label>Rol<select id=sRole><option>Personel</option><option>Yönetici</option></select></label><label>Durum<select id=sStatus><option>Aktif</option><option>Pasif</option></select></label></div>`;else {let isNew=type==='newChild', sib=type==='sibling', fri=type==='friend';body=`<div class=hint>${isNew?'Yalnızca Çocuk Adı ve Veli Adı zorunludur. Eksik bilgileri daha sonra ekleyebilirsiniz.':(sib?'Veli bilgileri mevcut çocuktan devralınır; dilediğiniz zaman değiştirebilirsiniz.':'Kısa kayıt ile bağımsız çocuk kaydı oluşturun.')}</div><div class=form><label>Çocuk adı<input id=fName value="${isNew?'':c.name}" required></label><label>Çocuk soyadı<input id=fSurname value="${isNew?'':c.surname}"></label><label>Veli adı<input id=fGuardian value="${isNew?'':(sib?c.guardian:c.guardian)}" required></label><label>Veli soyadı<input id=fGSurname value="${isNew?'':c.gsurname}"></label><label>Telefon (opsiyonel)<input id=fPhone value="${isNew?'':c.phone}"></label><label>Masa No<input id=fTable value="${isNew?'':(sib||fri?c.table:c.table)}"></label><label class=full>Kısa tanım / Not<textarea id=fNote>${isNew?'':c.note}</textarea></label>${!isNew?'<label class=full><input id=late type=checkbox> Geç fark edilen girişi düzelt</label>':''}</div>`}let foot=type==='history'?`<button class=primary onclick="closeModal()">Kapat</button>`:`<button class=ghost onclick="closeModal()">${type==='exit'?'Geri Dön':'Vazgeç'}</button><button class="${type==='exit'?'dark':'primary'}" onclick="submit('${type}')">${({newChild:'Kaydet',edit:'Kaydet',sibling:'Süreyi Şimdi Başlat',friend:'Süreyi Şimdi Başlat',alarm:'Alarmı Kur',move:'Tamam',break:'Molaya Çıkar',exit:'Tahsil Et ve Çıkışı Tamamla',membership:'Üyeliği Oluştur',reservation:'Rezervasyonu Kaydet',staff:'Kaydet'})[type]}</button>`;return `<div class=modal-bg onclick="if(event.target===this)closeModal()"><section class=modal><div class=modal-head><h2>${title}</h2><p>${c&&type!=='newChild'&&type!=='reservation'&&type!=='staff'?name(c)+' Bilgileri':''}</p></div><div class=modal-body>${body}</div><div class=modal-foot>${foot}</div></section></div>`}
function show(x){S.modal=x;render()}function closeModal(){S.modal=null;render()}function go(x){S.page=x;S.selected=null;render()}function logout(){S.loggedOut=true;S.mobileMenu=false;S.showNotices=false;save()}function login(){S.role=S.loginRole||'Yönetici';S.loggedOut=false;S.page='Ana Sayfa';save()}function openChild(id){S.selected=id;S.page='profile';render()}function cancelReservation(i){S.reservations[i].status='İptal';toast('Rezervasyon iptal edildi.');save()}function act(a,id){S.selected=id;let map={'Düzenle':'edit','Kardeş Ekle':'sibling','Arkadaş Ekle':'friend','Alarm Kur':'alarm','Masa Taşı':'move','Hareketler':'history','Molaya Çıkar':'break','Molayı Bitir':'endBreak','Çıkış / Hesap →':'exit'};if(map[a]==='endBreak'){let c=child(),b=c.breaks.find(x=>!x.end);b.end=iso();c.status='OYUNDA';log(c,'Moladan Döndü','Mola sonlandırıldı.');toast('Mola sonlandırıldı.');save()}else show(map[a])}
function val(id){return document.getElementById(id)?.value.trim()}function submit(type){let c=child();if(['newChild','edit','sibling','friend'].includes(type)){let n=val('fName'),g=val('fGuardian');if(!n||!g)return toast('Çocuk Adı ve Veli Adı zorunludur.');if(type==='edit'){let old=name(c);c.name=n;c.surname=val('fSurname');c.guardian=g;c.gsurname=val('fGSurname');c.phone=val('fPhone');c.table=val('fTable');c.note=val('fNote');log(c,'Bilgi Güncellemesi',old+' bilgileri güncellendi.');if(document.getElementById('late').checked){c.originalEntered=c.entered;c.entered=iso(-90);log(c,'Geç Fark Edilen Giriş Düzeltildi','Orijinal giriş saati korundu.')}closeModal();toast('Bilgiler başarıyla güncellendi.');save();return}let nc={id:Date.now(),name:n,surname:val('fSurname'),guardian:g,gsurname:val('fGSurname'),phone:val('fPhone'),table:val('fTable'),location:'İç Alan',sid:'F-'+String(Math.floor(Math.random()*999999)).padStart(6,'0'),entered:iso(),status:'OYUNDA',creator:S.role==='Yönetici'?'Senanur Sarak':'Ayşe Yılmaz',note:val('fNote'),member:false,breaks:[],logs:[['Oyuna Girdi',iso(),'Kayıt oluşturuldu.']]};S.children.unshift(nc);if(type!=='newChild'){S.relationships.push({a:c.id,b:nc.id,type:type==='sibling'?'Kardeş':'Arkadaş'});log(c,type==='sibling'?'Kardeş Eklendi':'Arkadaş Eklendi',name(nc)+' kaydı eklendi.')}S.modal=null;toast(type==='newChild'?'Çocuk başarıyla kaydedildi.':'Çocuk başarıyla kaydedildi.');save();return}if(type==='move'){let old=c.table;c.table=val('moveTable');log(c,'Masa Değiştirildi','Eski: '+(old?'Masa '+old:'Masasız')+' · Yeni: '+(c.table?'Masa '+c.table:'Masasız'));closeModal();toast('Masa başarıyla değiştirildi.');save();return}if(type==='alarm'){let min=S.alarm||30;S.notices.unshift({text:name(c)+' için alarm '+min+' dakika sonra çalacak.',child:c.id,read:false});log(c,'Alarm Kuruldu',min+' dakika sonrası için alarm kuruldu.');closeModal();toast('Alarm başarıyla kuruldu.');save();return}if(type==='break'){c.status='MOLADA';c.breaks.push({start:iso(S.breakOffset||0)});log(c,'Molaya Çıktı','Mola başlatıldı.');closeModal();toast('Mola başlatıldı.');save();return}if(type==='exit'){c.status='ÇIKTI';c.exited=iso();log(c,'Çıkış Yapıldı','Seans kapatıldı.');if(S.role==='Yönetici'&&!c.member)S.payments.unshift({date:iso(),child:name(c),guardian:c.guardian+' '+c.gsurname,type:'Oyun seansı',amount:price(c),method:S.payMethod||'Nakit',staff:'Senanur Sarak'});closeModal();toast('Çıkış başarıyla tamamlandı.');save();return}if(type==='membership'){let ch=val('memChild'),pack=val('memPack'),p=S.settings[pack];let cc=S.children.find(x=>name(x)===ch);cc.member=true;S.memberships.unshift({child:ch,pack,end:'14 Aralık 2026',price:p});S.payments.unshift({date:iso(),child:ch,guardian:cc.guardian,type:'Üyelik satışı',amount:p,method:val('memMethod'),staff:'Senanur Sarak'});closeModal();toast('Abonelik başarıyla oluşturuldu.');save();return}if(type==='reservation'){if(!val('rChild')||!val('rGuard'))return toast('Çocuk Adı ve Veli Adı zorunludur.');S.reservations.unshift({id:Date.now(),type:val('rType'),child:val('rChild'),guardian:val('rGuard'),date:val('rDate'),start:val('rStart'),end:val('rEnd'),count:val('rCount'),table:val('rTable'),amount:+val('rAmount')||0,status:val('rStatus'),note:val('rNote')});closeModal();toast('Rezervasyon başarıyla oluşturuldu.');save();return}if(type==='staff'){if(!val('sName')||!val('sUser'))return toast('Ad Soyad ve Kullanıcı adı zorunludur.');S.staff.push({name:val('sName'),phone:val('sPhone'),username:val('sUser'),role:val('sRole'),status:val('sStatus')});closeModal();toast('Personel başarıyla eklendi.');save()}}
function render(){let view=S.loggedOut?Login():(S.page==='profile'?Profile():({ 'Ana Sayfa':Dashboard,'Çocuklar':Children,'Üyelikler':Memberships,'Ödemeler':Payments,'Rezervasyonlar':Reservations,'Raporlar':Reports,'Personel':Staff,'Ayarlar':Settings}[S.page]||Dashboard)());document.getElementById('app').innerHTML=view}render();setInterval(()=>{if(!S.modal)render()},60000);
const standardModal=Modal;
function startBulk(){S.bulkMode=true;S.selectedChildren={};render()}
function cancelBulk(){S.bulkMode=false;S.selectedChildren={};render()}
function toggleChild(id){S.selectedChildren=S.selectedChildren||{};S.selectedChildren[id]?delete S.selectedChildren[id]:S.selectedChildren[id]=true;render()}
function completeBulkExit(){let selected=S.children.filter(x=>S.selectedChildren?.[x.id]&&active(x));selected.forEach(c=>{c.status='ÇIKTI';c.exited=iso();log(c,'Çıkış Yapıldı','Toplu kapatma ile seans kapatıldı.');if(S.role==='Yönetici'&&!c.member)S.payments.unshift({date:iso(),child:name(c),guardian:c.guardian+' '+c.gsurname,type:'Toplu oyun seansı',amount:price(c),method:'Nakit',staff:'Senanur Sarak'})});S.modal=null;S.bulkMode=false;S.selectedChildren={};toast(selected.length+' çocuğun çıkışı başarıyla tamamlandı.');save()}
function BulkModal(){let list=S.children.filter(x=>S.selectedChildren?.[x.id]);return `<div class=modal-bg onclick="if(event.target===this)closeModal()"><section class=modal><div class=modal-head><h2>Seçilen Çocukları Kapat</h2><p>Toplu çıkış işlemi</p></div><div class=modal-body><div class=hint>Onaydan sonra seçilen ${list.length} seans kapanır; her çocuğun hareket ve ödeme kaydı ayrı ayrı korunur.</div><div class=timeline>${list.map(c=>`<div class=event><b>${name(c)}</b><small>${c.sid} · ${c.table?'Masa '+c.table:'Masasız'}${S.role==='Yönetici'?' · '+(c.member?'Üyelik':money(price(c))):''}</small></div>`).join('')}</div></div><div class=modal-foot><button class=ghost onclick="closeModal()">Geri Dön</button><button class=dark onclick="completeBulkExit()">Seçilenleri Kapat</button></div></section></div>`}
Modal=function(){return S.modal==='bulkExit'?BulkModal():standardModal()};
const appVersion='2026-09-14-accounts-reports';
if(S.appVersion!==appVersion){S.staff=[{id:'gokce',name:'Gökçe Kutlu',phone:'',username:'gokce.kutlu',role:'Yönetici',status:'Aktif'},{id:'goksel',name:'Göksel Boran Kutlu',phone:'',username:'goksel.boran',role:'Personel',status:'Aktif'},{id:'oya',name:'Oya Kutlu',phone:'',username:'oya.kutlu',role:'Personel',status:'Aktif'}];S.currentUser='gokce';S.appVersion=appVersion;localStorage.setItem('oyunKafe',JSON.stringify(S))}
function currentStaff(){return S.staff.find(x=>x.id===S.currentUser)||S.staff[0]}
function isAdmin(){return currentStaff().role==='Yönetici'}
const savedAppShell=AppShell;
AppShell=function(content){let me=currentStaff(),nav=['Ana Sayfa','Çocuklar'];if(isAdmin())nav.push('Üyelikler','Ödemeler','Rezervasyonlar','Raporlar','Personel','Ayarlar');return `<div class="app ${S.theme==='dark'?'theme-dark':''}"><header class=top><button class=menu-toggle aria-label="Menüyü aç" onclick="S.mobileMenu=!S.mobileMenu;render()">☰</button><div class=brand><i>○</i>Oyun Kafe</div><div class=spacer></div><div class=user><b>${me.name}</b>${me.role}</div><button class=bell onclick="S.showNotices=!S.showNotices;render()">♟${S.notices.some(n=>!n.read)?'<i class=dot></i>':''}</button></header>${S.showNotices?Notifications():''}<div class="nav-backdrop ${S.mobileMenu?'open':''}" onclick="S.mobileMenu=false;render()"></div><div class=shell><aside class="side ${S.mobileMenu?'open':''}"><div class=nav-list>${nav.map(n=>`<button class="nav ${S.page===n?'active':''}" onclick="go('${n}');S.mobileMenu=false">${n}</button>`).join('')}</div><div class=session-control><small>${me.name}<br>${me.role}</small><button class=logout onclick="logout()">↪ Oturumu Kapat</button></div></aside><main class=main>${content}</main></div>${S.modal?Modal():''}${S.toast?`<div class=toast>${S.toast}</div>`:''}</div>`}
Login=function(){return `<div class=login-screen><section class="card login-card"><div class=brand><i>○</i>Oyun Kafe</div><h1>Oturumu Aç</h1><p class=sub>Devam etmek için kullanıcı hesabınızı seçin.</p><div class=role-select>${S.staff.filter(x=>x.status==='Aktif').map(x=>`<button class="${S.loginUser===x.id||(!S.loginUser&&x.id==='gokce')?'on':''}" onclick="S.loginUser='${x.id}';render()"><b>${x.name}</b><br><small>${x.role}</small></button>`).join('')}</div><button class=primary style="width:100%" onclick="login()">Oturumu Aç</button></section></div>`}
login=function(){S.currentUser=S.loginUser||'gokce';S.role=currentStaff().role;S.loggedOut=false;S.page='Ana Sayfa';save()};
logout=function(){S.loggedOut=true;S.mobileMenu=false;S.showNotices=false;save()};
Session=function(c){let m=mins(c),financial=isAdmin(),p=price(c),checked=S.selectedChildren?.[c.id]?'checked':'',meter=financial?`<div class=meter><div class=meter-line><span>${c.member?'Üyelik aktif':'Bu fiyata '+(m<=60?60-m:30-(m-60)%30)+' dk daha'}</span><span>${c.member?'Üyelik kapsamında':money(p+S.pricing.half)}</span></div><div class=bar><i style="width:${(m<=60?m/60:((m-60)%30)/30)*100}%"></i></div></div>`:`<div class=meter><div class=meter-line><span>Aktif oyun süresi takip ediliyor</span></div><div class=bar><i style="width:${(m<=60?m/60:((m-60)%30)/30)*100}%"></i></div></div>`;return `<article class="card session" onclick="${S.bulkMode?`toggleChild(${c.id})`:`openChild(${c.id})`}"><div class=row>${S.bulkMode?`<input class=select-child type=checkbox ${checked} onclick="event.stopPropagation();toggleChild(${c.id})" aria-label="${name(c)} seç">`:''}<div class=avatar>${c.name[0]}</div><div><div class=child-name>${name(c)}</div><div class=sub>${c.guardian} ${c.gsurname} · ${c.phone||'Telefon eklenmemiş'}</div></div><div class="badge ${c.status==='MOLADA'?'break':''}">${c.status}</div></div><div class=meta><span class=pill>Seans ID · ${c.sid}</span><span class=pill>${c.table?'Masa '+c.table:'Masasız'}</span><span class=pill>${c.location}</span></div><div class=metrics><div class=metric><label>AKTİF SÜRE</label><strong>${duration(m)}</strong><small>Giriş ${time(c.entered)}</small></div>${financial?`<div class="metric price"><label>ŞU AN</label><strong>${c.member?'Üye':money(p)}</strong><small>${c.status==='MOLADA'?'Sayaç durdu':'Sayaç çalışıyor'}</small></div>`:`<div class=metric><label>DURUM</label><strong>${c.status}</strong><small>${c.status==='MOLADA'?'Mola devam ediyor':'Sayaç çalışıyor'}</small></div>`}</div>${meter}<div class=sub>Kaydı Açan: ${c.creator}</div>${S.bulkMode?'':`<div class=actions onclick="event.stopPropagation()">${['Düzenle','Kardeş Ekle','Arkadaş Ekle','Alarm Kur','Masa Taşı','Hareketler',c.status==='MOLADA'?'Molayı Bitir':'Molaya Çıkar','Çıkış / Hesap →'].map(x=>`<button onclick="act('${x}',${c.id})">${x}</button>`).join('')}</div>`}</article>`}
function reportRows(from,to){let start=new Date(from+'T00:00:00'),end=new Date(to+'T23:59:59');return S.children.flatMap(c=>c.logs.map(l=>({Tarih:new Date(l[1]),Çocuk:name(c),'Seans ID':c.sid,'Hareket':l[0],Açıklama:l[2],'Kayıt Açan':c.creator}))).filter(x=>x.Tarih>=start&&x.Tarih<=end).sort((a,b)=>a.Tarih-b.Tarih)}
function exportLogs(kind){if(!isAdmin())return toast('Bu sayfaya erişim yetkiniz bulunmamaktadır.');let today=new Date().toISOString().slice(0,10),from=kind==='daily'?today:(document.getElementById('reportStart')?.value||today),to=kind==='daily'?today:(document.getElementById('reportEnd')?.value||today);if(from>to)return toast('Başlangıç tarihi bitiş tarihinden sonra olamaz.');let rows=reportRows(from,to),headers=['Tarih','Çocuk','Seans ID','Hareket','Açıklama','Kayıt Açan'],esc=v=>'"'+String(v??'').replaceAll('"','""')+'"',csv=[headers.join(';'),...rows.map(r=>[r.Tarih.toLocaleString('tr-TR'),r.Çocuk,r['Seans ID'],r.Hareket,r.Açıklama,r['Kayıt Açan']].map(esc).join(';'))].join('\r\n'),blob=new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`${kind==='daily'?'gunluk':'donemsel'}-hareket-raporu-${from}-${to}.csv`;a.click();URL.revokeObjectURL(a.href);toast(rows.length+' kayıt Excel için dışa aktarıldı.')}
Reports=function(){if(!isAdmin())return restricted();let today=new Date().toISOString().slice(0,10),revenue=S.payments.reduce((n,p)=>n+p.amount,0);return AppShell(`<div class=page-head><div><h1>Raporlar</h1><p>Yönetici raporları ve Excel dışa aktarma</p></div></div><div class=kpis>${Kpi('Günlük Çocuk Sayısı',S.children.length)}${Kpi('Toplam Tahsilat',money(revenue))}${Kpi('Aktif Seans',S.children.filter(active).length)}${Kpi('Kayıtlı Personel',S.staff.length)}</div><section class=card style="padding:20px"><h2>Hareket Kayıtlarını Excel'e Aktar</h2><p class=sub>İndirilen CSV dosyası Microsoft Excel’de doğrudan açılır. Kayıtlar tarih, çocuk, seans ve işlem bilgileriyle dışa aktarılır.</p><div class=toolbar><button class=primary onclick="exportLogs('daily')">Bugünün Loglarını İndir</button><input id=reportStart type=date value="${today}"><input id=reportEnd type=date value="${today}"><button class=dark onclick="exportLogs('period')">Dönemsel Logları İndir</button></div></section>`)}
Settings=function(){if(!isAdmin())return restricted();return AppShell(`<div class=page-head><div><h1>Ayarlar</h1><p>Görünüm ve işletme ayarları</p></div></div><section class=card style="padding:20px;margin-bottom:16px"><h2>Görünüm</h2><p class=sub>Uygulama temasını seçin. Tercih bu cihazda kalıcı olarak saklanır.</p><div class=choice><button class="${S.theme!=='dark'?'on':''}" onclick="S.theme='light';save()">Aydınlık Mod</button><button class="${S.theme==='dark'?'on':''}" onclick="S.theme='dark';save()">Karanlık Mod</button></div></section><section class=card style="padding:20px"><h2>Fiyatlandırma</h2><div class=form><label>İlk 1 Saat<input type=number value=${S.pricing.first} onchange="S.pricing.first=+this.value;save()"></label><label>Her Ek 30 Dakika<input type=number value=${S.pricing.half} onchange="S.pricing.half=+this.value;save()"></label></div></section>`)}
document.head.insertAdjacentHTML('beforeend',`<style>.theme-dark{--bg:#14202c;--ink:#eaf2f6;--muted:#a8b7c2;--line:#304354}.theme-dark .top,.theme-dark .side,.theme-dark .card,.theme-dark .kpi,.theme-dark .modal,.theme-dark .modal-foot,.theme-dark .notice,.theme-dark .table{background:#1d2b38;color:#eaf2f6}.theme-dark .metric,.theme-dark .table th{background:#253746;color:#eaf2f6}.theme-dark .session-control{border-color:#304354}.theme-dark .nav{color:#c4d1d9}.theme-dark .logout{background:#42282c;color:#ffc9c9}.select-child{width:20px;height:20px;accent-color:var(--teal)}</style>`);
const accountShell=AppShell;
AppShell=function(content){return accountShell(content).replace('class="app ',`class="app ${isAdmin()?'role-admin':'role-personel'} `)};
document.head.insertAdjacentHTML('beforeend',`<style>.role-personel .profile .metric.price,.role-personel .profile .meter{display:none}.role-personel .profile .metrics{grid-template-columns:1fr}</style>`);
render();
</script></body></html>
