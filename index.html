<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Oyun Kafe</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root{--teal:#16877f;--green:#05c878;--navy:#173b5c;--bg:#f4f8fa;--line:#dbe7eb;--muted:#647e92;--amber:#e8ad00}
    *{box-sizing:border-box} body{margin:0;background:var(--bg);color:#142d46;font:14px system-ui,-apple-system,Segoe UI,sans-serif}
    button,input,select{font:inherit} button{cursor:pointer;border:0;font-weight:800}.top{height:82px;background:#fff;display:flex;align-items:center;padding:0 28px;gap:18px;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:4}.brand{font-size:24px;font-weight:900}.brand i{font-style:normal;color:#b63cdb}.sp{flex:1}.user{font-weight:800}.top button{border-radius:12px;padding:11px 14px;background:#edf7f7;color:var(--navy)}
    .shell{display:flex}.side{width:275px;min-height:calc(100vh - 82px);padding:25px 18px;background:#137a73;color:#fff}.nav{display:block;width:100%;padding:14px 16px;margin:3px 0;border-radius:9px;background:transparent;color:#eafffa;text-align:left}.nav.active{background:#24948c}.main{padding:32px;flex:1;max-width:1650px}.hidden{display:none!important}.welcome{font-size:29px;margin:8px 0}.muted{color:var(--muted)}
    .buttons{display:flex;gap:11px;margin:19px 0}.buttons button,.primary,.orange{border-radius:11px;padding:13px 18px;color:#fff}.primary{background:var(--teal)}.orange{background:#ff6900}.kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:13px;margin:22px 0}.kpi,.card{background:#fff;border:1px solid var(--line);border-radius:15px}.kpi{padding:17px}.kpi span{font-size:12px;color:#63798d}.kpi b{display:block;margin-top:9px;font-size:28px}.kpi:nth-child(1){background:var(--teal);color:#fff}.kpi:nth-child(2){background:var(--green);color:#fff}.kpi:nth-child(3){background:#ffba0a;color:#fff}.section-head{display:flex;justify-content:space-between;align-items:center;gap:15px;margin:28px 0 17px}.section-head h2{font-size:19px;margin:0}.filters{display:flex;align-items:center;gap:7px;flex-wrap:wrap}.filter{padding:10px 14px;border:1px solid var(--line);border-radius:10px;background:#fff;color:#4b6780}.filter.selected{color:#087f76;border-color:#8bd8d3;background:#e9f8f6}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(330px,1fr));gap:18px}.card{padding:18px;border-left:3px solid var(--green)}.card.break{border-left-color:var(--amber)}.head{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}.name{font-size:18px;font-weight:900}.identity{margin-top:5px;line-height:1.55}.status{white-space:nowrap;padding:6px 10px;border-radius:30px;background:#d8faea;color:#007d53;font-weight:900}.status.break{background:#fff1c9;color:#a76d00}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:18px 0}.metric{background:#f3f8f9;padding:12px;border-radius:12px;min-height:110px}.metric small{color:#657b8e;font-weight:800}.metric b{display:block;font-size:19px;margin:6px 0}.metric span{font-size:13px;line-height:1.4}.billing{display:flex;justify-content:space-between;align-items:end;margin-top:10px}.membership{color:#647e92}.money{text-align:right;color:#fa5212;font-size:21px;font-weight:900}.pricebox{margin-top:14px;padding:13px 15px;background:#e8f8f6;border-radius:12px;display:flex;justify-content:space-between;color:#14736e;font-weight:800}.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:15px}.actions button{border:1px solid var(--line);border-radius:10px;background:#fff;color:#25465f;padding:12px 8px}.actions .break-action{background:#f1f7f8}.actions .exit{background:#fff0f1;color:#e04b5c;border-color:#ffbdc4}.empty{padding:28px;text-align:center}.modal{position:fixed;inset:0;background:#17354b99;display:grid;place-items:center;z-index:8;padding:15px}.box{background:#fff;padding:24px;border-radius:18px;width:min(430px,94vw);box-shadow:0 15px 45px #152d4088}.box h1,.box h2{margin-top:0}input,select{width:100%;padding:12px;border:1px solid var(--line);border-radius:9px;margin:6px 0 12px}.modal-buttons{display:flex;gap:9px}.modal-buttons button{padding:11px 15px;border-radius:9px}.secondary{background:#edf3f5;color:#35536c}.toast{position:fixed;right:18px;bottom:18px;background:#173b5c;color:#fff;padding:14px 18px;border-radius:11px;z-index:12;box-shadow:0 8px 24px #173b5c66}
    @media(max-width:800px){.side{display:none}.top{padding:0 16px;height:74px}.brand{font-size:22px}.main{padding:18px}.welcome{font-size:25px}.kpis{grid-template-columns:repeat(2,1fr)}.kpis .kpi:nth-child(5){display:none}.section-head{align-items:flex-start;flex-direction:column}.metrics{gap:8px}.metric{padding:10px;min-width:0}.metric b{font-size:17px}.user{max-width:90px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}}
  </style>
</head>
<body>
  <header class="top"><div class="brand"><i>🕊</i> Oyun Kafe</div><div class="sp"></div><span id="usr" class="user"></span><button id="out" class="hidden">↪ Çıkış</button></header>
  <div class="shell">
    <aside class="side">
      <button class="nav active">Ana Sayfa</button><button class="nav">Çocuklar</button><button class="nav">Üyelikler</button><button class="nav">Ödemeler</button><button class="nav">Raporlar</button><button class="nav">Ayarlar</button>
    </aside>
    <main class="main">
      <section id="login" class="box"><h1>Giriş</h1><p class="muted">Merkezi Oyun Kafe yönetimi</p><input id="email" placeholder="E-posta" type="email"><input id="pass" placeholder="Şifre" type="password"><button class="primary" onclick="signin()">Giriş yap</button><p id="error"></p></section>
      <section id="app" class="hidden">
        <h1 class="welcome">Hoş geldiniz, <span id="who">Yönetici</span> 👋</h1><p class="muted">Bugünkü oyun alanı durumunu buradan takip edebilirsiniz.</p>
        <div class="buttons"><button class="primary" onclick="showAdd()">＋ Çocuk Kaydı</button><button class="orange" onclick="showMember()">＋ Yeni Üyelik</button></div>
        <section class="kpis"><div class="kpi"><span>OYUN ALANINDA</span><b id="all">0</b></div><div class="kpi"><span>OYUNDA</span><b id="play">0</b></div><div class="kpi"><span>MOLADA</span><b id="br">0</b></div><div class="kpi"><span>BUGÜN GİRİŞ</span><b id="today">0</b></div><div class="kpi"><span>BUGÜNKÜ CİRO</span><b id="revenue">₺0</b></div></section>
        <div class="section-head"><h2>Oyun Alanında <small id="count" class="muted"></small></h2><div class="filters"><button class="filter selected" data-filter="all">Tümü</button><button class="filter" data-filter="OYUNDA">Oyunda</button><button class="filter" data-filter="MOLADA">Molada</button><button class="filter" data-filter="member">Üyelikli</button></div></div>
        <section id="cards" class="cards"></section>
      </section>
    </main>
  </div>
  <div id="modal" class="modal hidden"><div class="box"><h2>Yeni Çocuk Kaydı</h2><input id="child" placeholder="Çocuğun adı"><input id="guardian" placeholder="Veli adı"><input id="table" placeholder="Masa (opsiyonel)"><div class="modal-buttons"><button class="primary" onclick="create()">Kaydı Başlat</button><button class="secondary" onclick="hide()">Vazgeç</button></div></div></div>
  <div id="memberModal" class="modal hidden"><div class="box"><h2>Yeni Üyelik</h2><select id="memberChild"></select><input id="memberPackage" placeholder="Paket adı (ör. 1 Aylık)"><input id="memberPrice" type="number" min="0" placeholder="Ücret"><div class="modal-buttons"><button class="orange" onclick="createMember()">Üyeliği Aç</button><button class="secondary" onclick="hideMember()">Vazgeç</button></div></div></div>
  <div id="toast" class="toast hidden"></div>
  <script>
    const sb=supabase.createClient('https://wdknvlhtkimlkrmxuegd.supabase.co','sb_publishable_AEdSGBGd1i_qRFP_3ofpJQ_V9kw5dcN');
    let uid,allVisits=[],allBreaks=[],membershipIds=new Set(),selectedFilter='all';
    const now=()=>new Date().toISOString(), id=()=>crypto.randomUUID();
    function mins(from,to=new Date()){return Math.max(0,Math.floor((new Date(to)-new Date(from))/60000))}
    function textDuration(m){return `${Math.floor(m/60)} sa ${m%60} dk`}
    function breakMinutes(v){return allBreaks.filter(b=>b.visit_id===v.id).reduce((n,b)=>n+mins(b.started_at,b.ended_at||new Date()),0)}
    function activeMinutes(v){return Math.max(0,mins(v.entered_at)-breakMinutes(v))}
    function money(n){return `₺${Number(n||0).toLocaleString('tr-TR')}`}
    function notify(message){toast.textContent=message;toast.classList.remove('hidden');setTimeout(()=>toast.classList.add('hidden'),3500)}
    function escapeHtml(value){const d=document.createElement('div');d.textContent=value||'';return d.innerHTML}
    async function load(){
      const {data:{user}}=await sb.auth.getUser();if(!user)return;uid=user.id;
      login.classList.add('hidden');app.classList.remove('hidden');usr.textContent=user.email;out.classList.remove('hidden');
      const [visitsResult,membersResult]=await Promise.all([
        sb.from('visits').select('*,children(*)').in('status',['OYUNDA','MOLADA']).order('entered_at'),
        sb.from('memberships').select('child_id,status,ends_at').eq('status','Aktif')
      ]);
      if(visitsResult.error){notify(visitsResult.error.message);return}
      allVisits=visitsResult.data||[];
      const ids=allVisits.map(v=>v.id);
      const breaksResult=ids.length?await sb.from('breaks').select('*').in('visit_id',ids):{data:[]};
      if(breaksResult.error){notify(breaksResult.error.message);return}
      allBreaks=breaksResult.data||[];
      membershipIds=new Set((membersResult.data||[]).filter(m=>!m.ends_at||new Date(m.ends_at+'T23:59:59')>=new Date()).map(m=>m.child_id));
      const profile=await sb.from('profiles').select('full_name').eq('id',uid).maybeSingle();
      who.textContent=profile.data?.full_name||'Yönetici';
      all.textContent=allVisits.length;play.textContent=allVisits.filter(v=>v.status==='OYUNDA').length;br.textContent=allVisits.filter(v=>v.status==='MOLADA').length;
      today.textContent=allVisits.filter(v=>new Date(v.entered_at).toDateString()===new Date().toDateString()).length;
      revenue.textContent='₺0';render();
    }
    function render(){
      const rows=allVisits.filter(v=>selectedFilter==='all'||(selectedFilter==='member'?membershipIds.has(v.child_id):v.status===selectedFilter));
      count.textContent=`(${rows.length} çocuk)`;
      cards.innerHTML=rows.map(v=>{
        const child=v.children||{};const paused=v.status==='MOLADA';const bmin=breakMinutes(v);const isMember=membershipIds.has(v.child_id);
        return `<article class="card ${paused?'break':''}"><div class="head"><div><div class="name">${escapeHtml(child.first_name)} ${escapeHtml(child.last_name)}</div><div class="identity muted">♟ Masa: ${escapeHtml(v.table_no||'Atanmamış')} · Telefon yok<br>Veli: ${escapeHtml(child.guardian_first_name)}</div></div><span class="status ${paused?'break':''}">● ${paused?'Molada':'Oyunda'}</span></div><div class="metrics"><div class="metric"><small>GİRİŞ SAATİ</small><b>${new Date(v.entered_at).toLocaleTimeString('tr-TR',{hour:'2-digit',minute:'2-digit'})}</b><span>Oyun alanına giriş</span></div><div class="metric"><small>AKTİF SÜRE</small><b>${textDuration(activeMinutes(v))}</b><span>${paused?'Mola nedeniyle durdu':'Ücretlendirme çalışıyor'}</span></div><div class="metric"><small>MOLA</small><b>${textDuration(bmin)}</b><span>${paused?'Mola devam ediyor':'Toplam mola'}</span></div></div><div class="billing"><span class="membership">• ${isMember?'Aktif üyelik':'Üyeliksiz · Saatlik'}</span><div class="money">ŞU AN<br>${isMember?'Üyelik':money(0)}</div></div>${isMember?'<div class="pricebox"><span>Üyelik kapsamında</span><small>Aktif oyun süresi takip ediliyor</small></div>':''}<div class="actions">${paused?`<button class="break-action" onclick="resume('${v.id}')">▶ Molayı Bitir</button>`:`<button class="break-action" onclick="pause('${v.id}')">☕ Mola Başlat</button>`}<button onclick="details('${v.id}')">Detay</button><button class="exit" onclick="finish('${v.id}')">↪ Çıkış</button></div></article>`;
      }).join('')||'<div class="card empty">Bu filtrede aktif çocuk bulunmuyor.</div>';
    }
    async function create(){
      if(!child.value.trim()||!guardian.value.trim())return notify('Çocuk ve veli adı gerekli.');
      const childRef=id(),visitRef=id();
      const {data:c,error:childError}=await sb.from('children').insert({first_name:child.value.trim(),guardian_first_name:guardian.value.trim(),created_by:uid,client_ref:childRef}).select().single();
      if(childError)return notify(childError.message);
      const {error:visitError}=await sb.from('visits').insert({child_id:c.id,session_id:'F-'+Date.now(),table_no:table.value.trim()||null,status:'OYUNDA',created_by:uid,client_ref:visitRef});
      if(visitError)return notify(visitError.message);
      child.value='';guardian.value='';table.value='';hide();notify('Çocuk kaydı merkezi sisteme eklendi.');await load();
    }
    async function pause(visitId){
      const visit=allVisits.find(v=>v.id===visitId);if(!visit?.client_ref)return notify('Merkezi seans kimliği bulunamadı. Sayfayı yenileyin.');
      const {error}=await sb.rpc('apply_break_operation',{p_action:'start',p_visit_ref:visit.client_ref,p_break_ref:id(),p_occurred_at:now()});
      if(error)return notify(error.message);notify('Mola tüm cihazlarda kaydedildi.');await load();
    }
    async function resume(visitId){
      const visit=allVisits.find(v=>v.id===visitId);const openBreak=allBreaks.find(b=>b.visit_id===visitId&&!b.ended_at);
      if(!visit?.client_ref)return notify('Merkezi seans kimliği bulunamadı. Sayfayı yenileyin.');
      const {error}=await sb.rpc('apply_break_operation',{p_action:'end',p_visit_ref:visit.client_ref,p_break_ref:openBreak?.client_ref||null,p_occurred_at:now()});
      if(error)return notify(error.message);notify('Mola merkezi sistemde bitirildi.');await load();
    }
    async function finish(visitId){
      if(!confirm('Çıkış yapılsın mı?'))return;
      const {error}=await sb.from('visits').update({status:'ÇIKTI',exited_at:now()}).eq('id',visitId);
      if(error)return notify(error.message);notify('Çıkış merkezi sisteme kaydedildi.');await load();
    }
    function details(visitId){const v=allVisits.find(x=>x.id===visitId);if(v)notify(`${v.children.first_name}: aktif süre ${textDuration(activeMinutes(v))}, mola ${textDuration(breakMinutes(v))}.`)}
    function showAdd(){modal.classList.remove('hidden')} function hide(){modal.classList.add('hidden')}
    function showMember(){memberChild.innerHTML=allVisits.map(v=>`<option value="${v.child_id}">${escapeHtml(v.children.first_name)} ${escapeHtml(v.children.last_name)}</option>`).join('')||'<option>Önce çocuk kaydı açın</option>';memberModal.classList.remove('hidden')} function hideMember(){memberModal.classList.add('hidden')}
    async function createMember(){const childId=memberChild.value;if(!childId||!memberPackage.value.trim())return notify('Çocuk ve paket adı gerekli.');const {error}=await sb.from('memberships').insert({child_id:childId,package_name:memberPackage.value.trim(),price:Number(memberPrice.value||0),status:'Aktif',starts_at:new Date().toISOString().slice(0,10),created_by:uid});if(error)return notify(error.message);memberPackage.value='';memberPrice.value='';hideMember();notify('Üyelik merkezi sisteme eklendi.');await load()}
    async function signin(){const {error:e}=await sb.auth.signInWithPassword({email:email.value,password:pass.value});if(e)error.textContent=e.message;else load()}
    out.onclick=async()=>{await sb.auth.signOut();location.reload()};
    document.querySelectorAll('.filter').forEach(button=>button.onclick=()=>{selectedFilter=button.dataset.filter;document.querySelectorAll('.filter').forEach(b=>b.classList.toggle('selected',b===button));render()});
    ['visits','breaks','children','memberships'].forEach(tableName=>sb.channel('central-'+tableName).on('postgres_changes',{event:'*',schema:'public',table:tableName},()=>load()).subscribe());
    setInterval(()=>{if(uid)load()},15000);load();
  </script>
</body>
</html>
